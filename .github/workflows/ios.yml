name: iOS Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  SCHEME: MusicStore
  PROJECT: MusicStore.xcodeproj
  DERIVED_DATA_PATH: .build

jobs:
  build-and-test:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Show Xcode & Swift version
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -derivedDataPath "$DERIVED_DATA_PATH"

      - name: Select simulator destination
        id: destination
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m 1 "iPhone" | sed -E 's/^[[:space:]]*([^(]+) \(.*/\1/')
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=${{ steps.destination.outputs.device }}" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$DERIVED_DATA_PATH/Build/Products/Debug-iphonesimulator/MusicStore.app" \
            MusicStore-simulator.zip

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: simulator-app
          path: MusicStore-simulator.zip

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=${{ steps.destination.outputs.device }}" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath TestResults \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult

  release:
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Download simulator app
        uses: actions/download-artifact@v4
        with:
          name: simulator-app

      - name: Publish simulator build to releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view simulator-build >/dev/null 2>&1; then
            gh release create simulator-build \
              --title "Simulator Build" \
              --notes "Latest iOS Simulator build of MusicStore from \`${{ github.sha }}\`" \
              --latest
          fi
          gh release upload simulator-build MusicStore-simulator.zip --clobber
